<section class="chat-shell">
  <header class="chat-shell__header">
    <div>
      <span class="chat-shell__eyebrow">Live conversation</span>
      <h3>Chat</h3>
    </div>
    <p-tag [value]="messages.length + ' messages'" severity="contrast"></p-tag>
  </header>

  <div #chatMessages class="chat-shell__messages" (scroll)="onScroll()">
    <ng-container *ngIf="messages.length === 0; else messageList">
      <div class="chat-shell__empty">
        <i class="pi pi-comments"></i>
        <span>No messages yet. Start the conversation.</span>
      </div>
    </ng-container>

    <ng-template #messageList>
      <div *ngFor="let message of messages; trackBy: trackByMessageId" class="chat-bubble">
        <app-user-avatar 
          [username]="message.username" 
          [profileImageUrl]="message.profileImageUrl"
          [size]="24">
        </app-user-avatar>
        <div class="chat-bubble__content">
          <span class="chat-bubble__username">{{ '@' + message.username }}</span>
          <span class="chat-bubble__text">{{ message.message }}</span>
        </div>
      </div>
    </ng-template>
  </div>

  <div *ngIf="errorMessage" class="chat-shell__error">
    <i class="pi pi-exclamation-circle"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <form [formGroup]="messageForm" class="chat-shell__composer" (ngSubmit)="sendMessage()">
    <input
      pInputText
      type="text"
      formControlName="message"
      placeholder="Send a message to chat..."
      maxlength="500">

    <p-button
      type="submit"
      icon="pi pi-send"
      [loading]="sending"
      [disabled]="messageForm.invalid"
      ariaLabel="Send message">
    </p-button>
  </form>
</section>
