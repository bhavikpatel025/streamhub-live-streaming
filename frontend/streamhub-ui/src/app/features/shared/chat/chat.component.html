<section class="chat-shell">
  <header class="chat-shell__header">
    <div>
      <span class="chat-shell__eyebrow">Live conversation</span>
      <h3>Chat</h3>
    </div>
    <p-tag [value]="messages.length + ' messages'" severity="contrast"></p-tag>
  </header>

  <div #chatMessages class="chat-shell__messages">
    @if (messages.length === 0) {
      <div class="chat-shell__empty">
        <i class="pi pi-comments"></i>
        <span>No messages yet. Start the conversation.</span>
      </div>
    } @else {
      @for (message of messages; track message.id) {
        <div class="chat-bubble">
          <p-avatar [label]="getUserInitial(message.username)" shape="circle" size="normal"></p-avatar>
          <div class="chat-bubble__body">
            <div class="chat-bubble__meta">
              <strong>{{ message.username }}</strong>
              <span>{{ message.sentAt | date: 'shortTime' }}</span>
            </div>
            <p>{{ message.message }}</p>
          </div>
        </div>
      }
    }
  </div>

  @if (errorMessage) {
    <div class="chat-shell__error">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>
  }

  <form [formGroup]="messageForm" class="chat-shell__composer" (ngSubmit)="sendMessage()">
    <input
      pInputText
      type="text"
      formControlName="message"
      placeholder="Send a message to chat..."
      maxlength="500">

    <p-button
      type="submit"
      icon="pi pi-send"
      [loading]="sending"
      [disabled]="messageForm.invalid"
      ariaLabel="Send message">
    </p-button>
  </form>
</section>
